<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rot Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<style>
/* Layout: one full-bleed specimen; lyrics are written into it by the simulation, so there is no overlay UI. */
:root{ --bg:#0a0806; --ink:#ece4d1; --dim:#a59a86; color-scheme:dark; }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,sans-serif;overflow:hidden;cursor:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<canvas id="gl" aria-label="Simulated decaying specimen"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="nogl" hidden>This specimen needs WebGL2, which this browser did not provide.</div>

<script>
(() => {
'use strict';

/* =====================================================================
   Context
   ===================================================================== */
const glc = document.getElementById('gl');
const fxc = document.getElementById('fx');
const gl = glc.getContext('webgl2', {antialias:false, alpha:false, depth:false, stencil:false, premultipliedAlpha:false, powerPreference:'high-performance'});
const fx = fxc.getContext('2d');
if (!gl) { document.getElementById('nogl').hidden = false; return; }
const HAS_FLOAT = !!gl.getExtension('EXT_color_buffer_float');
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let _s = (Math.random() * 4294967296) >>> 0;
function R() { _s = (_s + 0x6D2B79F5) | 0; let t = Math.imul(_s ^ (_s >>> 15), 1 | _s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rnd = Math.random;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   Lyrics: edit these. Each line is grown in mould, then rots while the next grows.
   ===================================================================== */
const LYRICS = {
  lines: [
    'THE ROT GETS IN',
    'EVERYTHING SOFT GOES BACK TO THE GROUND',
  ],
  substrate: 1,     // 0 bread, 1 citrus peel, 2 apple flesh, 3 beech wood (or use #bread, #citrus, #apple, #wood)
  speed: 6,         // time-lapse multiplier for the biology
  start: 0.8,       // seconds before the first line is inoculated
  grow: 3.6,        // seconds the inoculation sweep takes to cross a line, plus fill
  hold: 3.2,        // seconds a line stays fully grown before it starts to rot
  gap: 1.2,         // seconds between a line starting to rot and the next line being inoculated
  loop: true,
  font: '"Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif',
  maxRows: 3,
  fringe: 0.72,     // chance a hypha survives each step past a letter edge (1 = grows anywhere)
  spill: 0.22,      // how fertile the substrate is outside the letters (0 = nothing grows there)
  warp: 4.5,        // how far letter outlines are pushed around by noise, in grid cells
  wild: 0.6,        // rate of airborne spores, bacteria and slime mould across the whole specimen
};
const LYRIC_MODE = LYRICS.lines.length > 0;

/* =====================================================================
   Substrates and organisms
   ===================================================================== */
const SUBS = [
  { id:0, genus:'Triticum aestivum', part:'bread crumb', relief:7.5, gloss:0.06, sss:0.15, nut:0.95, wat:0.22,
    A:[0.93,0.86,0.71], B:[0.79,0.68,0.50], F:[0.99,0.96,0.88], r1:[0.66,0.60,0.47], r2:[0.36,0.30,0.21], r3:[0.12,0.09,0.06], liq:[0.24,0.17,0.08],
    arr:[1.2,0.9,0.9,0.5], bac:0.4, temp:21.2, seeds:6, slime:0.55 },
  { id:1, genus:'Citrus sinensis', part:'peel', relief:4.2, gloss:0.42, sss:0.35, nut:0.75, wat:0.3,
    A:[0.98,0.56,0.13], B:[0.88,0.40,0.05], F:[1.0,0.72,0.28], r1:[0.80,0.60,0.30], r2:[0.47,0.31,0.12], r3:[0.15,0.10,0.04], liq:[0.34,0.20,0.05],
    arr:[2.4,0.5,0.4,0.5], bac:0.6, temp:20.6, seeds:5, slime:0.35 },
  { id:2, genus:'Malus domestica', part:'cut flesh', relief:3.2, gloss:0.5, sss:0.5, nut:1.0, wat:0.48,
    A:[0.97,0.91,0.73], B:[0.90,0.80,0.56], F:[1.0,0.98,0.88], r1:[0.74,0.52,0.26], r2:[0.40,0.21,0.08], r3:[0.12,0.06,0.03], liq:[0.32,0.16,0.05],
    arr:[1.3,0.9,0.55,1.0], bac:1.6, temp:21.8, seeds:5, slime:0.3 },
  { id:3, genus:'Fagus sylvatica', part:'sapwood', relief:3.4, gloss:0.12, sss:0.08, nut:0.55, wat:0.38,
    A:[0.66,0.57,0.44], B:[0.52,0.44,0.33], F:[0.44,0.35,0.25], r1:[0.75,0.71,0.60], r2:[0.33,0.24,0.15], r3:[0.10,0.07,0.05], liq:[0.15,0.10,0.06],
    arr:[0.5,0.4,0.25,1.4], bac:0.3, temp:17.4, seeds:7, slime:0.8 },
];

// Fungi. Distances are in grid cells, rates are per tick.
const SP = [
  { key:'pen', speed:0.042, wiggle:0.13, sense:2.6, sa:0.55, turn:0.4, wN:1.0, wSelf:1.7, wOther:2.6, wBac:1.0,
    branch:0.6, bAng:0.5, life:15, dep:0.5, eat:0.05, crowd:0.45,
    thick:0.011, yld:0.45, spoT:0.5, spoR:0.012, rotK:0.00022, watK:0.00004, ring:360,
    hy:[0.95,0.97,0.94], hyA:0.15, gut:'rgba(60,112,96,0.7)', puff:[95,150,130] },
  { key:'asp', speed:0.045, wiggle:0.15, sense:2.6, sa:0.55, turn:0.4, wN:1.0, wSelf:1.6, wOther:2.6, wBac:1.0,
    branch:0.55, bAng:0.55, life:15, dep:0.5, eat:0.05, crowd:0.45,
    thick:0.012, yld:0.45, spoT:0.45, spoR:0.014, rotK:0.00026, watK:0.00004, ring:300,
    hy:[0.97,0.94,0.82], hyA:0.14, gut:'rgba(40,34,28,0.75)', puff:[40,36,30] },
  { key:'rhi', speed:0.075, wiggle:0.09, sense:4.0, sa:0.45, turn:0.22, wN:1.0, wSelf:1.0, wOther:2.0, wBac:0.5,
    branch:0.16, bAng:0.7, life:40, dep:0.38, eat:0.03, crowd:0.3,
    thick:0.016, yld:0.42, spoT:0.6, spoR:0.006, rotK:0.0003, watK:0.00006, ring:500,
    hy:[0.9,0.9,0.88], hyA:0.21, gut:'rgba(70,70,70,0.7)', puff:[60,60,58] },
  { key:'fus', speed:0.052, wiggle:0.14, sense:2.8, sa:0.5, turn:0.38, wN:1.0, wSelf:1.5, wOther:2.2, wBac:1.0,
    branch:0.45, bAng:0.55, life:18, dep:0.5, eat:0.045, crowd:0.4,
    thick:0.011, yld:0.45, spoT:0.6, spoR:0.008, rotK:0.0003, watK:0.00005, ring:340,
    hy:[0.99,0.9,0.93], hyA:0.16, gut:'rgba(190,110,110,0.7)', puff:[220,150,150] },
];

/* =====================================================================
   GLSL
   ===================================================================== */
const NOISE = `
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(17.1,3.7); a*=0.5; } return s/0.97; }
float fbm3(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(17.1,3.7); a*=0.5; } return s/0.875; }
vec3 worley(vec2 p){ vec2 i=floor(p), f=fract(p); float d1=9.0, d2=9.0, id=0.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec2 g=vec2(float(x),float(y)); vec2 o=hash22(i+g); vec2 r=g+o-f; float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; id=hash12(i+g+7.7); } else if(d<d2){ d2=d; } }
  return vec3(sqrt(d1), sqrt(d2), id); }
`;

const HENC = HAS_FLOAT ? `float HENC(float h){return h;} float HDEC(float v){return v;}`
                       : `float HENC(float h){return clamp(h/64.0+0.5,0.0,1.0);} float HDEC(float v){return (v-0.5)*64.0;}`;

const VS_TRI = `#version 300 es
out vec2 vUv;
void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); vUv=p; gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;

/* --- substrate generator: R height, G tone, B feature, A nutrient richness --- */
const FS_BASE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec2 uCss; uniform int uSub; uniform vec2 uSeed;
${NOISE}
vec4 bread(vec2 p){
  vec2 w=vec2(fbm3(p*0.004), fbm3(p*0.004+7.0))*34.0;
  vec2 q=p+w;
  vec3 a=worley(q/24.0);
  vec3 b=worley(q/10.0+3.7);
  vec3 c=worley(q/4.2+9.1);
  float ia=smoothstep(0.0,0.22,a.y-a.x);
  float ib=smoothstep(0.0,0.28,b.y-b.x);
  float ic=smoothstep(0.0,0.35,c.y-c.x);
  float big=smoothstep(0.55,0.8,a.z);
  float h=1.0 - 0.55*ia*big - 0.35*ib*step(0.3,b.z) - 0.16*ic;
  h+=0.07*vnoise(p*vec2(0.9,0.5)) + 0.04*vnoise(p*1.7);
  float tone=0.5 + 0.55*(fbm(p*0.006)-0.5) + 0.18*(c.z-0.5) - 0.12*ia*big;
  float feat=(1.0-ib)*(1.0-ia*big);
  return vec4(clamp(h,0.0,1.0), tone, feat, 0.8+0.2*fbm3(p*0.003));
}
vec4 citrus(vec2 p){
  vec2 w=vec2(fbm3(p*0.007), fbm3(p*0.007+5.0))*7.0;
  vec3 g=worley((p+w)/6.2);
  vec3 g2=worley((p+w)/2.6+4.0);
  float pit=1.0-smoothstep(0.05,0.52,g.x);
  float h=0.62 + 0.2*(fbm(p*0.01)-0.5) - 0.24*pit*(0.6+0.4*g.z) + 0.05*(g2.y-g2.x) + 0.03*vnoise(p*1.3);
  float scar=smoothstep(0.62,0.7,fbm3(p*0.0045+13.0));
  h-=scar*0.12*vnoise(p*0.2);
  float tone=0.5 + 0.6*(fbm(p*0.005)-0.5) + 0.1*pit - 0.25*scar;
  return vec4(clamp(h,0.0,1.0), tone, pit*(0.5+0.5*g.z), 0.55+0.25*fbm3(p*0.003));
}
vec4 flesh(vec2 p){
  vec2 w=vec2(fbm3(p*0.005), fbm3(p*0.005+3.0))*12.0;
  vec3 c=worley((p+w)/5.2);
  float wall=1.0-smoothstep(0.0,0.11,c.y-c.x);
  float dome=smoothstep(0.0,0.5,c.y-c.x);
  float h=0.55 + 0.18*(fbm(p*0.006)-0.5) + 0.09*dome + 0.04*vnoise(p*0.8);
  float v=abs(fbm3(p*vec2(0.0042,0.0047)+11.0)-0.5);
  float strand=1.0-smoothstep(0.006,0.016,v);
  h-=strand*0.1;
  float tone=0.5 + 0.5*(fbm(p*0.004)-0.5) + 0.12*(c.z-0.5) - 0.2*strand;
  return vec4(clamp(h,0.0,1.0), tone, max(wall*0.5, strand), 0.9+0.1*fbm3(p*0.002));
}
vec4 wood(vec2 p){
  float warp=fbm(p*vec2(0.0016,0.006))*30.0 + fbm3(p*vec2(0.006,0.02))*3.0;
  float r=p.y*0.04 + warp;
  float ring=fract(r);
  float late=smoothstep(0.62,0.93,ring)*(1.0-smoothstep(0.93,1.0,ring));
  float fib=vnoise(vec2(p.x*0.035, p.y*1.15 + warp*3.0));
  float fib2=vnoise(vec2(p.x*0.12, p.y*2.3 + warp*5.0));
  float ray=smoothstep(0.82,0.95,vnoise(vec2(p.x*0.6, p.y*0.05+warp)));
  float h=0.6 + 0.13*fib + 0.06*fib2 - 0.07*late + 0.05*(fbm3(p*0.02)-0.5) + 0.05*ray;
  float chk=smoothstep(0.88,0.97,vnoise(vec2(p.x*0.003, p.y*0.22+warp*0.5)));
  h-=chk*0.45*smoothstep(0.3,0.7,vnoise(p*vec2(0.02,0.0)+vec2(0.0,p.y*0.001)));
  float tone=0.5 - 0.35*late + 0.2*(fib-0.5) + 0.35*(fbm(p*0.003)-0.5) + 0.12*ray;
  return vec4(clamp(h,0.0,1.0), tone, late, 0.5+0.12*fbm3(p*0.004));
}
void main(){
  vec2 p=vec2(vUv.x,1.0-vUv.y)*uCss + uSeed;
  vec4 r = uSub==0 ? bread(p) : uSub==1 ? citrus(p) : uSub==2 ? flesh(p) : wood(p);
  o=clamp(r,0.0,1.0);
}`;

/* --- G-buffer: albedo+gloss, height+spec+fuzz+subsurface --- */
const FS_G = `#version 300 es
precision highp float;
in vec2 vUv;
layout(location=0) out vec4 oA;
layout(location=1) out vec4 oH;
uniform sampler2D uBase, uEnv, uMyc, uSpo, uMisc, uAux, uHyph;
uniform vec2 uCss, uGrid;
uniform float uTime, uRelief, uGloss, uSSS;
uniform vec3 uSubA, uSubB, uSubF, uRot1, uRot2, uRot3, uLiq;
${NOISE}
${HENC}
vec4 bic(sampler2D t, vec2 uv){
  vec2 st=uv*uGrid-0.5; vec2 i=floor(st), f=st-i;
  vec2 f2=f*f, f3=f2*f;
  vec2 w0=(1.0-3.0*f+3.0*f2-f3)/6.0, w1=(4.0-6.0*f2+3.0*f3)/6.0, w2=(1.0+3.0*f+3.0*f2-3.0*f3)/6.0, w3=f3/6.0;
  vec2 g0=w0+w1, g1=w2+w3;
  vec2 p0=(i-0.5+w1/g0)/uGrid, p1=(i+1.5+w3/g1)/uGrid;
  return g0.y*(g0.x*texture(t,p0)+g1.x*texture(t,vec2(p1.x,p0.y))) + g1.y*(g0.x*texture(t,vec2(p0.x,p1.y))+g1.x*texture(t,p1));
}
void main(){
  vec2 g=vec2(vUv.x,1.0-vUv.y);
  vec2 p=g*uCss;
  vec2 cell=1.0/uGrid;
  vec2 j1=vec2(vnoise(p*0.06), vnoise(p*0.06+31.7))-0.5;
  vec2 j2=vec2(vnoise(p*0.29+7.1), vnoise(p*0.29+19.3))-0.5;
  vec2 gj=g+(j1*2.6+j2*1.1)*cell;
  vec4 B=texture(uBase,vUv);
  vec4 E=bic(uEnv, g+j1*1.0*cell);
  vec4 M=bic(uMyc, gj);
  vec4 S=bic(uSpo, gj+j2*0.6*cell);
  vec4 X=bic(uMisc, g+j1*1.3*cell);
  vec4 A=bic(uAux, gj);
  vec4 HY=texture(uHyph,vUv);
  float Mraw=dot(texture(uMyc,g),vec4(1.0));

  float rot=clamp(E.r,0.0,1.0), wat=clamp(E.g,0.0,1.0), bac=E.a;
  float mott=fbm3(p*0.018+3.0);

  /* substrate & decay */
  vec3 col=mix(uSubB,uSubA,B.g);
  col=mix(col,uSubF,B.b*0.45);
  float r1=smoothstep(0.03,0.42,rot+(mott-0.5)*0.2);
  float r2=smoothstep(0.32,0.8,rot+(mott-0.5)*0.24);
  float r3=smoothstep(0.74,1.0,rot+(mott-0.5)*0.12);
  float soak=smoothstep(0.015,0.14,rot)*(1.0-r2);
  col=mix(col,col*vec3(0.9,0.84,0.74)+vec3(0.04,0.035,0.02),soak*0.6);
  col=mix(col,uRot1*(0.85+0.3*B.g),r1);
  col=mix(col,uRot2*(0.78+0.5*mott),r2);
  col=mix(col,uRot3*(0.8+0.4*mott),r3);
  float wet=smoothstep(0.32,0.9,wat);
  col*=1.0-0.22*wet;
  col=mix(col,vec3(0.40,0.07,0.22),clamp(A.b,0.0,1.0)*0.72);
  float dig=clamp(A.r,0.0,1.0);
  float h=B.r*uRelief*(1.0-0.6*r2) - rot*12.0 - dig*9.0;
  if(r1>0.001){
    float wr=1.0-abs(fbm(p*0.03+9.0)*2.0-1.0);
    h+=wr*wr*3.8*r1*(1.0-r3*0.5)*(1.0-wet);
  }
  float gloss=uGloss*(1.0-0.55*r2)+wet*0.55+soak*0.15;
  float spec=0.3+0.7*wet;
  float fuzz=0.0;
  float sss=uSSS*(1.0-r2);
  col*=1.0-0.4*smoothstep(0.1,0.8,dig);

  float dry=1.0-smoothstep(0.12,0.34,wat);
  float moldc=clamp(smoothstep(0.05,0.6,M.r+M.g+M.b+M.a)+smoothstep(0.05,0.45,S.r+S.g+S.b+S.a)*0.8+smoothstep(0.15,0.4,bac),0.0,1.0);
  float crk=smoothstep(0.6,0.92,rot)*dry*(1.0-moldc);
  if(crk>0.01){
    vec3 w=worley(p/44.0+j1*0.5);
    float c=1.0-smoothstep(0.0,0.025+0.03*crk,w.y-w.x);
    vec3 w2=worley(p/16.0+5.0);
    float mask=smoothstep(0.6,0.8,fbm3(p*0.01+7.0))*smoothstep(0.7,1.0,crk);
    c=max(c,(1.0-smoothstep(0.0,0.03,w2.y-w2.x))*mask*0.7);
    h-=c*crk*7.0;
    col*=1.0-c*crk*0.75;
    h+=(1.0-c)*crk*smoothstep(0.0,0.2,w.y-w.x)*1.5;
  }

  /* pooled liquid & fermentation bubbles */
  float liq=smoothstep(0.6,0.88,wat)*smoothstep(0.35,0.7,rot);
  if(liq>0.001){
    float lvl=-rot*12.0-dig*9.0+1.6+0.35*sin(uTime*0.6+p.x*0.05+p.y*0.03);
    h=mix(h,max(h,lvl),liq);
    col=mix(col,uLiq*(0.75+0.5*mott),liq*0.9);
    gloss=mix(gloss,1.0,liq); spec=mix(spec,1.0,liq); sss*=1.0-liq;
    vec3 bw=worley(p/6.5+vec2(0.0,uTime*0.012));
    float life=fract(bw.z*13.7+uTime*0.025);
    float has=step(bw.z,0.4*liq)*step(life,0.8);
    float rr=(0.16+0.22*fract(bw.z*7.3))*smoothstep(0.0,0.12,life);
    float inb=1.0-smoothstep(rr-0.05,rr,bw.x);
    float dome=sqrt(max(0.0,1.0-(bw.x*bw.x)/(rr*rr+1e-4)));
    h+=has*inb*dome*2.4;
    col=mix(col,col*0.65+vec3(0.07,0.06,0.04),has*inb*0.5);
  }

  /* zone lines where colonies meet */
  float zl=smoothstep(0.12,0.45,X.r);
  col=mix(col,vec3(0.07,0.045,0.03),zl*0.9);
  h+=zl*0.8;

  /* bacterial slime */
  float bcov=smoothstep(0.12,0.3,bac);
  if(bcov>0.001){
    float st=X.a;
    vec3 bc=mix(vec3(0.9,0.84,0.66),vec3(0.78,0.2,0.24),smoothstep(0.25,0.5,st));
    bc=mix(bc,vec3(0.94,0.78,0.26),smoothstep(0.7,0.9,st));
    bc*=0.86+0.28*vnoise(p*0.07);
    col=mix(col,bc,bcov*0.8);
    h+=bcov*(1.4+1.8*smoothstep(0.3,0.95,bac));
    gloss=mix(gloss,0.93,bcov); spec=mix(spec,0.85,bcov); sss=mix(sss,0.55,bcov);
  }

  /* mycelium */
  float mt=M.r+M.g+M.b+M.a;

  c.beginPath(); c.ellipse(L * 0.11, 0, L * 0.16, L * 0.135, 0, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(30,18,8,0.8)'; c.lineWidth = 0.35; c.beginPath();
  for (let k = 0; k < 6; k++) { const bx = L * (0.02 + (k % 3) * 0.07), by = (k < 3 ? -1 : 1) * L * 0.06; c.moveTo(bx, by); c.lineTo(bx - L * 0.08, by * 1.5); }
  c.stroke();
  c.fillStyle = '#a07a4a'; c.beginPath(); c.ellipse(L * 0.3, 0, L * 0.085, L * 0.13, 0, 0, TAU); c.fill();
  c.fillStyle = '#b3241b';
  c.beginPath(); c.ellipse(L * 0.3, -L * 0.085, L * 0.075, L * 0.06, 0.2, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(L * 0.3, L * 0.085, L * 0.075, L * 0.06, -0.2, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,200,190,0.55)';
  c.beginPath(); c.arc(L * 0.28, -L * 0.1, L * 0.022, 0, TAU); c.arc(L * 0.28, L * 0.07, L * 0.022, 0, TAU); c.fill();
  if (flying) {
    const flap = Math.sin(b.wing) * 0.5;
    for (let side = -1; side <= 1; side += 2) {
      for (let k = 0; k < 4; k++) {
        const ang = side * (1.25 + flap * 0.6 + (k - 1.5) * 0.28);
        c.fillStyle = 'rgba(215,222,235,0.09)';
        c.beginPath(); c.ellipse(L * 0.08 + Math.cos(ang) * L * 0.36, Math.sin(ang) * L * 0.36, L * 0.38, L * 0.12, ang, 0, TAU); c.fill();
      }
    }
  } else {
    for (let side = -1; side <= 1; side += 2) {
      c.save(); c.translate(L * 0.06, side * L * 0.04); c.rotate(Math.PI + side * -0.2);
      c.fillStyle = 'rgba(220,226,238,0.26)'; c.strokeStyle = 'rgba(70,58,46,0.45)'; c.lineWidth = 0.35;
      c.beginPath(); c.ellipse(L * 0.36, 0, L * 0.4, L * 0.13, 0, 0, TAU); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(0, 0); c.lineTo(L * 0.76, -L * 0.02); c.moveTo(L * 0.05, L * 0.04); c.lineTo(L * 0.7, L * 0.07); c.moveTo(L * 0.05, -L * 0.04); c.lineTo(L * 0.66, -L * 0.08); c.moveTo(L * 0.38, -L * 0.06); c.lineTo(L * 0.42, L * 0.06); c.stroke();
      c.fillStyle = 'rgba(180,200,255,0.12)'; c.beginPath(); c.ellipse(L * 0.45, side * -L * 0.02, L * 0.2, L * 0.04, 0, 0, TAU); c.fill();

    }
  }
  c.restore();
  c.fillStyle = 'rgba(255,250,235,0.35)';
  c.beginPath(); c.ellipse(b.x - L * 0.06 * sc, b.y - L * 0.06 * sc - z * 0.1, L * 0.08 * sc, L * 0.04 * sc, -0.7, 0, TAU); c.fill();
}
function drawEgg(b) {
  const c = fx;
  c.save(); c.translate(b.x, b.y); c.rotate(b.a); c.scale(1.4, 1.4);
  c.fillStyle = 'rgba(14,7,0,0.25)'; c.beginPath(); c.ellipse(0.5, 0.6, 1.25, 0.6, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(252,250,240,0.96)'; c.beginPath(); c.ellipse(0, 0, 1.2, 0.52, 0, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(250,248,235,0.7)'; c.lineWidth = 0.22; c.beginPath();
  c.moveTo(1.1, -0.15); c.lineTo(2.3, -0.55); c.moveTo(1.1, 0.15); c.lineTo(2.3, 0.55); c.stroke();
  c.restore();
}
function larvaPath(b, ox, oy, wmul) {
  const NS = b.NS, sp = b.sp, c = fx, L = [], Rr = [];
  for (let i = 0; i < NS; i++) {
    const t = i / (NS - 1);

    const w = b.len * 0.14 * prof * wmul;

    L.push([sp[i * 2] - ty * w + ox, sp[i * 2 + 1] + tx * w + oy]); Rr.push([sp[i * 2] + ty * w + ox, sp[i * 2 + 1] - tx * w + oy]);

  c.quadraticCurveTo(tx + (tx - sp[(NS - 2) * 2] - ox) * 0.6, ty + (ty - sp[(NS - 2) * 2 + 1] - oy) * 0.6, Rr[NS - 1][0], Rr[NS - 1][1]);

function drawLarva(b) {
  const c = fx, sub = b.sub, NS = b.NS, sp = b.sp;
  c.fillStyle = `rgba(14,7,0,${0.28 * (1 - sub * 0.7)})`; larvaPath(b, 1.0, 1.3, 1.05); c.fill();
  const a = 0.95 - sub * 0.45;
  c.fillStyle = `rgba(${236 - sub * 50 | 0},${228 - sub * 70 | 0},${204 - sub * 90 | 0},${a})`;
  const [Lp] = larvaPath(b, 0, 0, 1); c.fill();
  c.strokeStyle = `rgba(150,128,96,${0.4 * a})`; c.lineWidth = 0.4; c.stroke();
  c.strokeStyle = `rgba(160,135,100,${0.35 * a})`; c.lineWidth = 0.3; c.beginPath();
  for (let i = 1; i < NS - 1; i++) {
    const t = i / (NS - 1), prof = t < 0.3 ? 0.32 + 2.27 * t : 1 - 0.18 * Math.pow((t - 0.3) / 0.7, 2), w = b.len * 0.14 * prof;
    let tx = sp[(i - 1) * 2] - sp[(i + 1) * 2], ty = sp[(i - 1) * 2 + 1] - sp[(i + 1) * 2 + 1]; const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;
    c.moveTo(sp[i * 2] - ty * w * 0.9, sp[i * 2 + 1] + tx * w * 0.9); c.lineTo(sp[i * 2] + ty * w * 0.9, sp[i * 2 + 1] - tx * w * 0.9);
  }
  c.stroke();
  c.strokeStyle = `rgba(78,50,28,${0.45 * a})`; c.lineWidth = Math.max(0.5, b.len * 0.05); c.beginPath();
  c.moveTo(sp[2], sp[3]); for (let i = 2; i < NS - 2; i++) c.lineTo(sp[i * 2], sp[i * 2 + 1]); c.stroke();
  c.strokeStyle = `rgba(255,255,250,${0.5 * a})`; c.lineWidth = 0.55; c.beginPath();
  c.moveTo(Lp[1][0] * 0.6 + sp[2] * 0.4 - 0.3, Lp[1][1] * 0.6 + sp[3] * 0.4 - 0.4);
  for (let i = 2; i < NS - 1; i++) c.lineTo(Lp[i][0] * 0.6 + sp[i * 2] * 0.4 - 0.3, Lp[i][1] * 0.6 + sp[i * 2 + 1] * 0.4 - 0.4);
  c.stroke();
  const hx = sp[0], hy = sp[1], ha = Math.atan2(sp[1] - sp[3], sp[0] - sp[2]);
  c.strokeStyle = `rgba(10,8,6,${0.9 * a})`; c.lineWidth = 0.45; c.beginPath();
  c.moveTo(hx - Math.cos(ha) * 1.2 + Math.sin(ha) * 0.3, hy - Math.sin(ha) * 1.2 - Math.cos(ha) * 0.3); c.lineTo(hx + Math.cos(ha) * 0.3, hy + Math.sin(ha) * 0.3);
  c.moveTo(hx - Math.cos(ha) * 1.2 - Math.sin(ha) * 0.3, hy - Math.sin(ha) * 1.2 + Math.cos(ha) * 0.3); c.lineTo(hx + Math.cos(ha) * 0.3, hy + Math.sin(ha) * 0.3);
  c.stroke();
  const tx = sp[(NS - 1) * 2], ty = sp[(NS - 1) * 2 + 1];
  c.fillStyle = `rgba(90,60,30,${0.6 * a})`; c.beginPath(); c.arc(tx - Math.cos(ha) * 0.6, ty - Math.sin(ha) * 0.6, 0.55, 0, TAU); c.fill();
}
function drawPupa(b) {
  const c = fx, L = b.len, t = Math.min(1, b.age / 700);
  c.save(); c.translate(b.x, b.y); c.rotate(b.a);
  c.fillStyle = 'rgba(14,7,0,0.3)'; c.beginPath(); c.ellipse(LX * 1.2, LY * 1.2, L * 0.52, L * 0.21, 0, 0, TAU); c.fill();
  const r = Math.round(220 - 120 * t), g = Math.round(200 - 140 * t), bl = Math.round(160 - 125 * t);
  c.fillStyle = b.empty ? `rgba(${r + 30},${g + 20},${bl + 10},0.75)` : `rgb(${r},${g},${bl})`;
  c.beginPath(); c.ellipse(0, 0, L * 0.5, L * 0.2, 0, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(30,15,5,0.4)'; c.lineWidth = 0.35; c.beginPath();
  for (let k = -3; k <= 3; k++) { const sx = k * L * 0.12; const h = L * 0.2 * Math.sqrt(Math.max(0, 1 - Math.pow(sx / (L * 0.5), 2))); c.moveTo(sx, -h); c.lineTo(sx, h); }
  c.stroke();
  if (b.empty) { c.fillStyle = 'rgba(20,10,4,0.75)'; c.beginPath(); c.ellipse(L * 0.42, 0, L * 0.09, L * 0.13, 0, 0, TAU); c.fill(); }
  c.fillStyle = 'rgba(255,230,200,0.35)'; c.beginPath(); c.ellipse(-L * 0.05, -L * 0.08, L * 0.3, L * 0.05, 0, 0, TAU); c.fill();
  c.restore();
}
function drawNema(b) {
  const c = fx, n = 12, L = b.len, a = b.a, ca = Math.cos(a), sa = Math.sin(a);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const pts = [];

    const t = i / (n - 1), along = (0.5 - t) * L, amp = L * 0.12 * Math.sin(b.ph - t * 7) * (0.4 + 0.6 * t);

  c.strokeStyle = 'rgba(238,232,212,0.72)'; c.lineWidth = 0.85; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const p of pts) c.lineTo(p[0], p[1]); c.stroke();

}
function drawBugs() {
  fx.setTransform(BD, 0, 0, BD, 0, 0);
  fx.clearRect(0, 0, W, H);
  for (const b of bugs) if (b.k === K_EGG) drawEgg(b); else if (b.k === K_PUPA) drawPupa(b);
  for (const b of bugs) if (b.k === K_NEMA) drawNema(b);
  for (const b of bugs) if (b.k === K_LARVA) drawLarva(b);
  for (const b of bugs) if (b.k === K_MITE || b.k === K_VELVET) drawMite(b);
  for (const b of bugs) if (b.k === K_SPRING) drawSpring(b);
  for (const b of bugs) if (b.k === K_FLY && b.z < 1) drawFly(b);
  for (const p of parts) { const f = 1 - p.m / p.l; fx.fillStyle = `rgba(${p.r},${p.g},${p.b},${0.75 * f})`; fx.fillRect(p.x, p.y, p.s, p.s); }
  for (const b of bugs) if (b.k === K_FLY && b.z >= 1) drawFly(b);
}

/* =====================================================================
   Render
   ===================================================================== */
const dirty = new Array(5).fill(true);
let rr = 0;
function uploadFields(all) {
  let budget = all ? 5 : (N < 120000 ? 3 : 2);
  for (let k = 0; k < 5 && budget > 0; k++) {
    const idx = (rr + k) % 5;
    if (!dirty[idx]) continue;
    const f = FIELDS[idx], p = PACKS[idx], len = f.length;
    for (let i = 0; i < len; i++) p[i] = f[i] * 255;
    gl.bindTexture(gl.TEXTURE_2D, fieldTex[idx]);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GW, GH, gl.RGBA, gl.UNSIGNED_BYTE, PACK8[idx]);

  }

}
const progFade = program(VS_TRI, `#version 300 es
precision mediump float; out vec4 o; void main(){ o=vec4(0.0); }`);
function fadeHyphae(f) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboHy); gl.viewport(0, 0, PW, PH);
  gl.enable(gl.BLEND); gl.blendColor(0, 0, 0, f); gl.blendFunc(gl.ZERO, gl.CONSTANT_ALPHA);
  gl.useProgram(progFade.p); gl.bindVertexArray(vaoEmpty); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);
}
function flushSegs() {
  if (nSeg === 0) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboHy); gl.viewport(0, 0, PW, PH);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progLine.p); gl.uniform2f(progLine.u.uCss, W, H);

}
let lightAz = 2.35, lightEl = 0.68;
function render(time) {
  uploadFields(false);
  flushSegs();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboG); gl.viewport(0, 0, PW, PH);
  gl.useProgram(progG.p);
  const texs = [texBase, ...fieldTex, texHy];
  const names = ['uBase', 'uEnv', 'uMyc', 'uSpo', 'uMisc', 'uAux', 'uHyph'];
  for (let i = 0; i < 7; i++) { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, texs[i]); gl.uniform1i(progG.u[names[i]], i); }

  gl.uniform1f(u.uRelief, SUB.relief); gl.uniform1f(u.uGloss, SUB.gloss); gl.uniform1f(u.uSSS, SUB.sss);
  gl.uniform3fv(u.uSubA, SUB.A); gl.uniform3fv(u.uSubB, SUB.B); gl.uniform3fv(u.uSubF, SUB.F);
  gl.uniform3fv(u.uRot1, SUB.r1); gl.uniform3fv(u.uRot2, SUB.r2); gl.uniform3fv(u.uRot3, SUB.r3); gl.uniform3fv(u.uLiq, SUB.liq);

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texGA); gl.uniform1i(progL.u.uA, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texGH); gl.uniform1i(progL.u.uH, 1);

/* =====================================================================
   Specimen lifecycle
   ===================================================================== */
let speed = LYRIC_MODE ? LYRICS.speed : 1, paused = false;
function newSpecimen(subId) {
  SUB = SUBS[subId];
  specSeed = [R() * 900 + 50, R() * 900 + 50];
  measure(); gridFor();
  allocTargets(); allocFields();
  if (fboHy) { gl.deleteFramebuffer(fboHy); gl.deleteTexture(texHy); fboHy = null; texHy = null; }
  allocHyphae(false);
  drawBase(fboBase, PW, PH);
  initSim();

  uploadFields(true);
}

let resizeTimer = 0;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const oW = W, oH = H;
    measure();
    if (W === oW && H === oH && glc.width === PW) return;
    const aspectChange = Math.abs(Math.log((W / H) / (oW / oH)));
    if (aspectChange > 0.25 || LYRIC_MODE) { newSpecimen(SUB.id); return; }
    csx = W / GW; csy = H / GH;
    for (const b of bugs) { b.x *= W / oW; b.y *= H / oH; if (b.sp) for (let i = 0; i < b.sp.length; i += 2) { b.sp[i] *= W / oW; b.sp[i + 1] *= H / oH; } }

}
addEventListener('resize', onResize);

/* =====================================================================
   Loop
   ===================================================================== */
const TPS = 30;

  return dT;
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  tickWorld(dt);
  if (LYRIC_MODE && !paused) fadeHyphae(Math.pow(0.91, dt));
  render((now - t0) / 1000);
  drawBugs();
  ftAvg = ftAvg * 0.95 + (dt * 1000) * 0.05; ftN++;

}
function onResizeForce() { measure(); allocTargets(); allocHyphae(true); drawBase(fboBase, PW, PH); }

// hooks for automated checks: step the world in fixed frames without waiting on real time
window.ROT = {
  step(seconds, fps = 30) { const n = Math.round(seconds * fps), was = paused; paused = false; for (let k = 0; k < n; k++) { tickWorld(1 / fps); if (LYRIC_MODE) fadeHyphae(Math.pow(0.91, 1 / fps)); if (nSeg > MAXSEG * 0.7) flushSegs(); } paused = was; flushSegs(); uploadFields(true); },
  advance(ticks, step = 1.5) { let t = 0; while (t < ticks) { advance(step); updateBugs(0.05, step); if (nSeg > MAXSEG * 0.7) flushSegs(); t += step; } flushSegs(); uploadFields(true); },

  freeze() { paused = true; }, thaw() { paused = false; last = performance.now(); },
  get T() { return T; }, get lt() { return lt; }, stats, census, bugs, newSpecimen,

const HASH_SUB = { bread: 0, citrus: 1, apple: 2, wood: 3 }[location.hash.slice(1)];
const fontReady = Promise.race([document.fonts ? document.fonts.load(`100px ${LYRICS.font}`) : Promise.resolve(), new Promise(r => setTimeout(r, 2500))]);
fontReady.catch(() => {}).then(() => {
  newSpecimen(HASH_SUB !== undefined ? HASH_SUB : LYRICS.substrate);
  last = performance.now();
  requestAnimationFrame(frame);
});
})();
